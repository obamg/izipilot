services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: izipilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: izipilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U izipilot"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    restart: unless-stopped
    # Only bind to localhost — Traefik/Nginx terminates TLS and proxies in.
    # Drop the `127.0.0.1:` prefix locally if you want to hit it directly.
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env.docker
    environment:
      MCP_PORT: 3001
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
